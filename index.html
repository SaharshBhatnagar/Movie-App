<!DOCTYPE html>
<html lang="en">
<head>

    <title>Movie-App</title>
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="CSS/header.css">

        <div class="nav">

            <div class="card-scroll" style="background-image: url(Movie-Images/Slider/Frozen-Slider.jpg);"></div>
            <div class="card-scroll" style="background-image: url(Movie-Images/Slider/Mufasa-Lion-King-slider.jpg);"></div>

            <div class="card-scroll" style="background-image: url(Movie-Images/Slider/How-To-Train-your-dragon.jpg);"></div>
        </div>

        <div class="movies-grid">

        </div>

    </main>

    <footer>

    </footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>

    <script src="data/moviePanel.js"></script>
