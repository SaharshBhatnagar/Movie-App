<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie-App</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/slider.css">
</head>
<body>

    <header>
        <div class="nav">
            <div class="logo">
                <h2>LOGO</h2>
            </div>

            <div class="search-container">
                <ion-icon name="search"></ion-icon>
                <input id="searchInput" type="text" placeholder="Search for a movie..." class="search-bar">
            </div>
        </div>
    </header>

    <main>

        <div class="auto-scroll">
            <div class ="container"></div>
                <!-- here js load movies to show as slide --> 
            </div>
        </div>

        <div class="movies-grid">
            <!-- here js load movies to show in grid/section -->
        </div>

    </main>

    <footer>

    </footer>

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="data/slidesData.js"></script>
    <script src="data/moviesData.js"></script> <!-- loads the movies data -->
    <script src="scripts/movieSlideShow.js"></script>
    <script src="scripts/movieGridShow.js"></script> <!-- generate html with loaded data -->
    
</body>
</html>
